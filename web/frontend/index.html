<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AERO-SPACE // 3D Exoplanetary Explorer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Globe.gl 3D Engine -->
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body data-planet="mars">

    <!-- Left Sidebar Panel: Input Parameters -->
    <aside id="ui-panel">
        <header class="panel-header">
            <h1>SPACE H</h1>
            <p id="current-view-label">Active Module: <strong id="planet-name">Mars (Surface)</strong></p>
        </header>

        <!-- Origin Planet Selector -->
        <section class="control-section" id="planet-selector-section">
            <label class="section-title">01. Origin Celestial Body</label>
            <div class="select-wrapper">
                <select id="planet-select">
                    <option value="mars">Mars</option>
                    <option value="moon">The Moon</option>
                </select>
            </div>
        </section>

        <!-- Analysis Variables & Weighting -->
        <section class="control-section" id="weights-section">
            <div class="section-title-row">
                <label class="section-title">02. Variables & Weighting</label>
                <span class="badge-count" id="active-vars-count">3 VARS</span>
            </div>

            <div class="select-wrapper">
                <select id="variable-select">
                    <option value="all">All Variables</option>
                    <option value="relieve">1. Relief</option>
                    <option value="ghi">2. GHI</option>
                    <option value="albedo">3. Albedo</option>
                </select>
            </div>

            <div class="weights-panel" id="weights-panel">
                <div class="weights-toolbar">
                    <span class="weights-desc">Weights (0.00 - 1.00):</span>
                    <button type="button" id="btn-balance-weights" class="btn-micro-action" title="Reset all weights to 50%">
                        Balance (50%)
                    </button>
                </div>

                <div class="sliders-list" id="sliders-container">
                    <!-- 1. Relief -->
                    <div class="slider-item" id="item-relieve" data-key="relieve">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-relieve" class="slider-label">Relief</label>
                                <button type="button" class="info-btn" data-info-key="relieve" aria-label="Information about Relief">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-relieve">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-relieve" data-key="relieve" min="0" max="100" value="50" step="1">
                    </div>

                    <!-- 2. GHI -->
                    <div class="slider-item" id="item-ghi" data-key="ghi">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-ghi" class="slider-label">GHI</label>
                                <button type="button" class="info-btn" data-info-key="ghi" aria-label="Information about GHI">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-ghi">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-ghi" data-key="ghi" min="0" max="100" value="50" step="1">
                    </div>

                    <!-- 3. Albedo -->
                    <div class="slider-item" id="item-albedo" data-key="albedo">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-albedo" class="slider-label">Albedo</label>
                                <button type="button" class="info-btn" data-info-key="albedo" aria-label="Information about Albedo">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-albedo">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-albedo" data-key="albedo" min="0" max="100" value="50" step="1">
                    </div>
                </div>

                <!-- Global Floating Tooltip (positioned by JS) -->
                <div id="var-tooltip" class="var-tooltip" role="tooltip" aria-hidden="true">
                    <div class="var-tooltip-title" id="var-tooltip-title"></div>
                    <div class="var-tooltip-body" id="var-tooltip-body"></div>
                </div>
            </div>
        </section>

        <!-- Coordinate Input -->
        <section class="control-section">
            <label class="section-title">03. Coordinate Input</label>
            <form id="coord-form" class="coord-form">
                <div class="input-grid">
                    <div class="input-field">
                        <label for="lat-input">LAT</label>
                        <input type="number" id="lat-input" step="any" placeholder="00.00" required>
                    </div>
                    <div class="input-field">
                        <label for="lon-input">LON</label>
                        <input type="number" id="lon-input" step="any" placeholder="00.00" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 8px;"><span>Project 3D Vector</span></button>
            </form>
        </section>

        <p id="left-hint-text" class="placeholder-text">Click on the 3D planet or enter coordinates to compute the terrestrial analog.</p>

        <!-- Return Button -->
        <button id="back-to-origin-btn" class="btn-secondary" style="display: none;">
            <span>↩ Return to Origin Orbits</span>
        </button>
    </aside>

    <!-- Collapse/Expand Left Panel Tab -->
    <button type="button" id="toggle-left-panel" class="panel-toggle-btn left-toggle" title="Hide / Show control panel">
        ◀
    </button>

    <!-- Central 3D Globe Container -->
    <main id="globe-container"></main>

    <!-- Collapse/Expand Right Panel Tab (appears when results are available) -->
    <button type="button" id="toggle-right-panel" class="panel-toggle-btn right-toggle" style="display: none;" title="Hide / Show results">
        ▶
    </button>

    <!-- Right Sidebar Panel: Terrestrial Analog Similarity -->
    <aside id="results-panel" class="results-panel" style="display: none;"></aside>

    <script type="module" src="app.js"></script>
</body>
</html>
