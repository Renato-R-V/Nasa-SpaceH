<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AERO-SPACE // 3D Exoplanetary Explorer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Globe.gl 3D Engine -->
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body>

    <!-- Panel Lateral de Control -->
    <aside id="ui-panel">
        <header class="panel-header">
            <div class="status-badge"><span class="pulse-dot"></span> SYSTEM ONLINE</div>
            <h1>EXOPLANETARY 3D</h1>
            <p id="current-view-label">Módulo Activo: <strong id="planet-name">Marte</strong></p>
        </header>

        <!-- Selector de Planeta de Origen -->
        <section class="control-section" id="planet-selector-section">
            <label class="section-title">01. Cuerpo Celeste de Origen</label>
            <div class="select-wrapper">
                <select id="planet-select">
                    <option value="mars">🔴 Marte (Superficie)</option>
                    <option value="moon">⚪ La Luna (Regolito)</option>
                </select>
            </div>
        </section>

        <!-- Variables de Análisis -->
        <section class="control-section">
            <label class="section-title">02. Variable Espectral</label>
            <div class="select-wrapper">
                <select id="variable-select">
                    <option value="elevation">Elevación y Topografía (DEM)</option>
                    <option value="minerals">Composición Mineral / Óxidos</option>
                    <option value="suitability">Idoneidad para Hábitat Base</option>
                </select>
            </div>
        </section>

        <!-- Inserción de Coordenadas -->
        <section class="control-section">
            <label class="section-title">03. Inserción de Coordenadas</label>
            <form id="coord-form" class="coord-form">
                <div class="input-grid">
                    <div class="input-field">
                        <label for="lat-input">LAT</label>
                        <input type="number" id="lat-input" step="any" placeholder="00.00" required>
                    </div>
                    <div class="input-field">
                        <label for="lon-input">LON</label>
                        <input type="number" id="lon-input" step="any" placeholder="00.00" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 10px;"><span>Proyectar Vector 3D</span></button>
            </form>
        </section>

        <!-- Tarjeta de Datos -->
        <section id="cluster-info" class="telemetry-card">
            <div class="card-header">
                <span>ESTADO DE ANÁLISIS</span>
                <span class="code">ID: #3D_READY</span>
            </div>
            <div class="card-body">
                <p class="placeholder-text">Haz clic sobre cualquier región del planeta 3D o introduce coordenadas para computar el análogo terrestre.</p>
            </div>
        </section>

        <!-- Botón de Retorno -->
        <button id="back-to-origin-btn" class="btn-secondary" style="display: none;">
            <span>↩ Retornar a Órbitas de Origen</span>
        </button>
    </aside>

    <!-- Contenedor del Globo 3D -->
    <main id="globe-container"></main>

    <!-- Script principal -->
    <script type="module" src="app.js"></script>
</body>
</html>
