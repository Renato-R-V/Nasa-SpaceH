<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AERO-SPACE // 3D Exoplanetary Explorer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Globe.gl 3D Engine -->
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body data-planet="mars">

    <!-- Panel Lateral Izquierdo: Parámetros de Entrada -->
    <aside id="ui-panel">
        <header class="panel-header">
            <div class="status-badge"><span class="pulse-dot"></span> SYSTEM ONLINE</div>
            <h1>EXOPLANETARY 3D</h1>
            <p id="current-view-label">Módulo Activo: <strong id="planet-name">Marte (Superficie)</strong></p>
        </header>

        <!-- Selector de Planeta de Origen -->
        <section class="control-section" id="planet-selector-section">
            <label class="section-title">01. Cuerpo Celeste de Origen</label>
            <div class="select-wrapper">
                <select id="planet-select">
                    <option value="mars">Marte</option>
                    <option value="moon">La Luna</option>
                </select>
            </div>
        </section>

        <!-- Variables de Análisis y Ponderación -->
        <section class="control-section" id="weights-section">
            <div class="section-title-row">
                <label class="section-title">02. Variables y Ponderación</label>
                <span class="badge-count" id="active-vars-count">8 VARS</span>
            </div>

            <div class="select-wrapper">
                <select id="variable-select">
                    <option value="all">Todas las Variables</option>
                    <option value="pendiente_media">1. Pendiente media</option>
                    <option value="pendiente_p90">2. Pendiente P90</option>
                    <option value="rugosidad">3. Rugosidad</option>
                    <option value="orientacion">4. Orientación</option>
                    <option value="relieve">5. Relieve</option>
                    <option value="valles_crestas">6. Valles y crestas</option>
                    <option value="ghi">7. GHI</option>
                    <option value="albedo">8. Albedo</option>
                </select>
            </div>

            <div class="weights-panel" id="weights-panel">
                <div class="weights-toolbar">
                    <span class="weights-desc">Pesos (0.00 - 1.00):</span>
                    <button type="button" id="btn-balance-weights" class="btn-micro-action" title="Restablecer todos los pesos al 50%">
                        Equilibrar (50%)
                    </button>
                </div>

                <div class="sliders-list" id="sliders-container">
                    <!-- 1. Pendiente media -->
                    <div class="slider-item" id="item-pendiente_media" data-key="pendiente_media">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-pendiente_media" class="slider-label">Pendiente media</label>
                                <button type="button" class="info-btn" data-info-key="pendiente_media" aria-label="Información sobre Pendiente media">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-pendiente_media">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-pendiente_media" data-key="pendiente_media" min="0" max="100" value="50" step="1">
                    </div>

                    <!-- 2. Pendiente P90 -->
                    <div class="slider-item" id="item-pendiente_p90" data-key="pendiente_p90">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-pendiente_p90" class="slider-label">Pendiente P90</label>
                                <button type="button" class="info-btn" data-info-key="pendiente_p90" aria-label="Información sobre Pendiente P90">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-pendiente_p90">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-pendiente_p90" data-key="pendiente_p90" min="0" max="100" value="50" step="1">
                    </div>

                    <!-- 3. Rugosidad -->
                    <div class="slider-item" id="item-rugosidad" data-key="rugosidad">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-rugosidad" class="slider-label">Rugosidad</label>
                                <button type="button" class="info-btn" data-info-key="rugosidad" aria-label="Información sobre Rugosidad">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-rugosidad">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-rugosidad" data-key="rugosidad" min="0" max="100" value="50" step="1">
                    </div>

                    <!-- 4. Orientación -->
                    <div class="slider-item" id="item-orientacion" data-key="orientacion">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-orientacion" class="slider-label">Orientación</label>
                                <button type="button" class="info-btn" data-info-key="orientacion" aria-label="Información sobre Orientación">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-orientacion">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-orientacion" data-key="orientacion" min="0" max="100" value="50" step="1">
                    </div>

                    <!-- 5. Relieve -->
                    <div class="slider-item" id="item-relieve" data-key="relieve">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-relieve" class="slider-label">Relieve</label>
                                <button type="button" class="info-btn" data-info-key="relieve" aria-label="Información sobre Relieve">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-relieve">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-relieve" data-key="relieve" min="0" max="100" value="50" step="1">
                    </div>

                    <!-- 6. Valles y crestas -->
                    <div class="slider-item" id="item-valles_crestas" data-key="valles_crestas">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-valles_crestas" class="slider-label">Valles y crestas</label>
                                <button type="button" class="info-btn" data-info-key="valles_crestas" aria-label="Información sobre Valles y crestas">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-valles_crestas">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-valles_crestas" data-key="valles_crestas" min="0" max="100" value="50" step="1">
                    </div>

                    <!-- 7. GHI -->
                    <div class="slider-item" id="item-ghi" data-key="ghi">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-ghi" class="slider-label">GHI</label>
                                <button type="button" class="info-btn" data-info-key="ghi" aria-label="Información sobre GHI">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-ghi">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-ghi" data-key="ghi" min="0" max="100" value="50" step="1">
                    </div>

                    <!-- 8. Albedo -->
                    <div class="slider-item" id="item-albedo" data-key="albedo">
                        <div class="slider-row-header">
                            <div class="slider-label-group">
                                <label for="slider-albedo" class="slider-label">Albedo</label>
                                <button type="button" class="info-btn" data-info-key="albedo" aria-label="Información sobre Albedo">ⓘ</button>
                            </div>
                            <span class="slider-val-badge" id="val-albedo">0.50 (50%)</span>
                        </div>
                        <input type="range" class="weight-slider" id="slider-albedo" data-key="albedo" min="0" max="100" value="50" step="1">
                    </div>
                </div>

                <!-- Tooltip flotante global (movido por JS) -->
                <div id="var-tooltip" class="var-tooltip" role="tooltip" aria-hidden="true">
                    <div class="var-tooltip-title" id="var-tooltip-title"></div>
                    <div class="var-tooltip-body" id="var-tooltip-body"></div>
                </div>
            </div>
        </section>

        <!-- Inserción de Coordenadas -->
        <section class="control-section">
            <label class="section-title">03. Inserción de Coordenadas</label>
            <form id="coord-form" class="coord-form">
                <div class="input-grid">
                    <div class="input-field">
                        <label for="lat-input">LAT</label>
                        <input type="number" id="lat-input" step="any" placeholder="00.00" required>
                    </div>
                    <div class="input-field">
                        <label for="lon-input">LON</label>
                        <input type="number" id="lon-input" step="any" placeholder="00.00" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 8px;"><span>Proyectar Vector 3D</span></button>
            </form>
        </section>

        <p id="left-hint-text" class="placeholder-text">Haz clic sobre el planeta 3D o introduce coordenadas para computar el análogo terrestre.</p>

        <!-- Botón de Retorno -->
        <button id="back-to-origin-btn" class="btn-secondary" style="display: none;">
            <span>↩ Retornar a Órbitas de Origen</span>
        </button>
    </aside>

    <!-- Pestaña para plegar/desplegar Panel Izquierdo -->
    <button type="button" id="toggle-left-panel" class="panel-toggle-btn left-toggle" title="Ocultar / Mostrar panel de control">
        ◀
    </button>

    <!-- Contenedor Central del Globo 3D -->
    <main id="globe-container"></main>

    <!-- Pestaña para plegar/desplegar Panel Derecho (aparece cuando hay resultados) -->
    <button type="button" id="toggle-right-panel" class="panel-toggle-btn right-toggle" style="display: none;" title="Ocultar / Mostrar resultados">
        ▶
    </button>

    <!-- Panel Lateral Derecho: Similitud del Análogo Terrestre -->
    <aside id="results-panel" class="results-panel" style="display: none;"></aside>

    <script type="module" src="app.js"></script>
</body>
</html>
