<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AERO-SPACE // Analogue GIS Explorer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>

    <!-- Panel Lateral Estilo Sala de Control -->
    <aside id="ui-panel">
        <header class="panel-header">
            <div class="status-badge">
                <span class="pulse-dot"></span> TELEMETRY ACTIVE
            </div>
            <h1>EXOPLANETARY GIS</h1>
            <p id="current-view-label">Módulo Activo: <strong id="planet-name">Marte</strong></p>
        </header>

        <!-- Selector de Cuerpo Celeste -->
        <section class="control-section" id="planet-selector-section">
            <label class="section-title">01. Cuerpo Celeste de Origen</label>
            <div class="select-wrapper">
                <select id="planet-select">
                    <option value="mars">🔴 Marte (Superficie)</option>
                    <option value="moon">⚪ La Luna (Regolito)</option>
                </select>
            </div>
        </section>

        <!-- Variables de Análisis -->
        <section class="control-section">
            <label class="section-title">02. Variable Espectral</label>
            <div class="select-wrapper">
                <select id="variable-select">
                    <option value="elevation">Elevación y Topografía (DEM)</option>
                    <option value="minerals">Composición Mineral / Óxidos</option>
                    <option value="suitability">Idoneidad para Hábitat Base</option>
                </select>
            </div>
        </section>

        <!-- Búsqueda Manual de Coordenadas -->
        <section class="control-section">
            <label class="section-title">03. Inserción de Coordenadas</label>
            <form id="coord-form" class="coord-form">
                <div class="input-grid">
                    <div class="input-field">
                        <label for="lat-input">LAT</label>
                        <input type="number" id="lat-input" step="any" placeholder="00.00" required>
                    </div>
                    <div class="input-field">
                        <label for="lon-input">LON</label>
                        <input type="number" id="lon-input" step="any" placeholder="00.00" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary"><span>Ejecutar Vector</span></button>
            </form>
        </section>

        <!-- Tarjeta de Datos del Clúster -->
        <section id="cluster-info" class="telemetry-card">
            <div class="card-header">
                <span>ESTADO DE ANALISIS</span>
                <span class="code">ID: #SYS_IDLE</span>
            </div>
            <div class="card-body">
                <p class="placeholder-text">Haz clic en cualquier sector del mapa o introduce coordenadas para computar el análogo terrestre.</p>
            </div>
        </section>

        <!-- Botón de Retorno -->
        <button id="back-to-origin-btn" class="btn-secondary" style="display: none;">
            <span>↩ Retornar a Órbita de Origen</span>
        </button>
    </aside>

    <!-- Contenedor del Mapa -->
    <main id="map"></main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Script principal -->
    <script type="module" src="app.js"></script>
</body>
</html>
